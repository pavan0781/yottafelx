name: Validate synthetic logistics data

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python -m returnables.generator --profile starter --output output/starter --verify-reproducibility
      - run: python -m returnables.verify --schema schema.sql --seed output/starter/seed.sql
